[project]
name = "shibboleth"
description = "Command line tool for tracking tasks"
readme = "README.md"
authors = [
    { name = "Wayne Werner", email = "wayne@waynewerner.com" }
]
requires-python = ">=3.10"
keywords = ["cli", "task", "tracking", "commandline", "productivity"]
dependencies = []
license = {text = "AGPL-3.0-or-later"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dynamic = ["version"]

[tool.hatch.version]
path = "src/shibboleth/__init__.py"

[project.scripts]
shibboleth = "shibboleth:run"
shibboleth-fancy = "shibboleth.fancy:run"

[project.optional-dependencies]
fancy = [
    "textual>=6.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-subtests>=0.15.0",
]
fancy = [
    "textual>=6.3.0",
]
